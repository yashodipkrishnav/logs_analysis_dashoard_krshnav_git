{% extends "base.html" %}

{% block content %}

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Masquerading Management</h3>
    </div>
    <div class="card-body">
        <form method="post" action="/masquerading">

            <div class="form-group">
                <label>SMTP Server Hostname</label>
		<select name="smtp_host" class="form-control">
		    <option value="ams1-smtp-7">ams1-smtp-7</option>
		    <option value="ams1-smtp-8">ams1-smtp-8</option>
		    <option value="ams3-smtp-7">ams3-smtp-8</option>
		</select>
            </div>

            <div class="form-group">
                <label>Customer Domain</label>
                <input type="text" name="domain" class="form-control">
            </div>

            <div class="form-group">
                <label>Service CI</label>
                <input type="text" name="service_ci" class="form-control">
            </div>

            <div class="form-group">
                <label>Configuration Type</label>
		<select id="option_type" name="option_type" class="form-control">
                    <option value="spf">SPF Based</option>
                    <option value="relay">Relay</option>
                </select>
            </div>

<!--            <div class="form-group">
                <label>Relay Host</label>
                <input type="text" name="relay_host" class="form-control">
            </div>

            <div class="form-group">
                <label>Relay Port</label>
                <input type="text" name="relay_port" class="form-control">
            </div>
-->
            <div id="relayFields">
                <div class="form-group">
                    <label>Relay Host</label>
                    <input type="text" name="relay_host" class="form-control">
                </div>
            
                <div class="form-group">
                    <label>Relay Port</label>
                    <input type="text" name="relay_port" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Validate
            </button>
        </form>
    </div>
</div>

<script>

function toggleRelayFields() {

    var option = document.getElementById("option_type").value;
    var relayDiv = document.getElementById("relayFields");

    if (option === "relay") {
        relayDiv.style.display = "block";
    } else {
        relayDiv.style.display = "none";
    }
}

document.addEventListener("DOMContentLoaded", function () {

    toggleRelayFields();

    document.getElementById("option_type")
            .addEventListener("change", toggleRelayFields);
});

</script>

{% endblock %}
